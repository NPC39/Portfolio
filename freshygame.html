    <!-- Lightbox Element -->
    <div id="lightbox" class="lightbox">
        <span id="close-lightbox" class="close-lightbox">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="">
    </div>

     <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeLightbox = document.getElementById('close-lightbox');
        const imagest = document.querySelectorAll('.image-gallery img');

        imagest.forEach(img => {
            img.style.cursor = 'pointer';
            img.addEventListener('click', () => {
                lightbox.classList.add('active');
                lightboxImg.src = img.src;
            });
        });

        closeLightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) {
                lightbox.classList.remove('active');
            }
        });
    </script>
    <footer>
        <p>Copyright &copy; 2026 NPPNPhotography</p>
    </footer>

    <script>
        const buttons = document.querySelectorAll('.year-btn');
        const images = document.querySelectorAll('.img-item');

        function filterImages(year) {
            images.forEach(img => {
                if (img.getAttribute('data-year') === year) {
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
            });
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                filterImages(button.getAttribute('data-year'));
            });
        });

        // Initialize view to 2023
        filterImages('2023');
        
    </script>
